services:
  api:
    build: .
    container_name: api
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__PostgreConnection=${DB_CONNECTION}
      - ConnectionStrings__RedisConnection=${REDIS_CONNECTION}
      - JwtSettings__Expiration=${JWTSETTINGS_EXPIRATION}
      - JwtSettings__SecretKey=${JWTSETTINGS_SECRETKEY}
      - AdminCredentials__UserName=${ADMINCREDENTIALS_USERNAME}
      - AdminCredentials__Email=${ADMINCREDENTIALS_EMAIL}
      - AdminCredentials__Password=${ADMINCREDENTIALS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: db
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=True
    ports:
      - 5341:5341
      - 8081:80

volumes:
  postgres_data:
  redis_data:

